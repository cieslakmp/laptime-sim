[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laptime-sim"
version = "0.1.0"
description = "Quasi-steady-state lap time simulator with web dashboard"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "shapely>=2.0",
    "gpxpy>=1.6",
    "pyproj>=3.6",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "jupyterlab>=4.0",
    "ipywidgets>=8.0",
    "matplotlib>=3.8",
    "plotly>=5.20",
]
ocp = [
    "casadi>=3.6",
]

[project.scripts]
laptime = "laptime.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["laptime"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["laptime"]
